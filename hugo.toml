baseURL = 'https://vanvj00001.github.io/wellness/'
title = 'Wellness 养生站'
theme = ["FixIt"]
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true

[languages.zh-cn]
locale = 'zh-CN'
label = '简体中文'
weight = 1
hasCJKLanguage = true

enableEmoji = true
enableRobotsTXT = true
enableGitInfo = false
buildFuture = false

paginate = 20

[frontmatter]
lastmod = ["lastmod", ":git", ":fileModTime"]

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 2
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 4

[params]
  version = "0.4.X"

  [params.app]
    title = "Wellness 养生站"

  [params.search]
    enable = true
    type = "fuse"

  [params.header]
    desktopMode = "sticky"
    [params.header.title]
      name = "Wellness 养生站"

  [params.footer]
    enable = true
    copyright = "2024-2026 Wellness 养生站"

  [params.home]
    days = "all"
    location = "all"
    read = true
    sort = "desc"

  [params.page]
    [params.page.comment]
      enable = false
    [params.page.math]
      enable = false
    [params.page.map]
      enable = false
    [params.pageTOC]
      enable = false
    [params.pageBreadcrumb]
      enable = true

  [params.fixit]
    [params.fixit.search]
      enable = true
    [params.fixit.repoEditURL]
      "" = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    lineNos = false
